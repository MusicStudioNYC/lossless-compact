<svg xmlns="http://www.w3.org/2000/svg" width="880" height="244" viewBox="0 0 880 244" role="img" aria-label="Time per compaction">
<title>Time per compaction</title>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#f0f0ee}
.title{font-size:15px;font-weight:600}.sub{font-size:12px;fill:#c3c2b7}.head{font-size:11.5px;fill:#c3c2b7}
.row{font-size:13px}.rowsub{font-size:11px;fill:#898781}.val{font-size:12px;font-variant-numeric:tabular-nums}
.tick{font-size:11px;fill:#898781}.key{font-size:11px;fill:#c3c2b7}.grid{stroke:#30363d;stroke-width:1}</style>
<text x="16" y="24" class="title">Time per compaction</text>
<text x="16" y="43" class="sub">same cases, log scale · lossless-compact + Jev is ~160× faster than a summary, the local ruleset ~2,100×</text>
