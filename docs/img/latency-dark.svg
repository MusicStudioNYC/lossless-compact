<text x="208" y="226" class="tick" text-anchor="middle">10 ms</text>
<line x1="336.0" x2="336.0" y1="60" y2="208" class="grid"/>
<text x="336" y="226" class="tick" text-anchor="middle">100 ms</text>
<line x1="464.0" x2="464.0" y1="60" y2="208" class="grid"/>
<text x="464" y="226" class="tick" text-anchor="middle">1 s</text>
<line x1="592.0" x2="592.0" y1="60" y2="208" class="grid"/>
